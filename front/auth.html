<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация/Регистрация</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script>
        // Функция обратного вызова для reCAPTCHA
        function onRecaptchaLoad() {
            console.log('reCAPTCHA загружена');
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #181818;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-container {
            background: #181818;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            width: 350px;
            padding: 0;
        }
        .form-header {
            background: #2d014d;
            border-radius: 10px 10px 0 0;
            padding: 18px 24px 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-header h2 {
            color: #fff;
            font-size: 20px;
            margin: 0;
        }
        .close-btn {
            color: #ff4d4d;
            font-size: 22px;
            text-decoration: none;
            cursor: pointer;
        }
        .auth-form {
            display: none;
            padding: 24px;
        }
        .auth-form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 18px;
            position: relative;
        }
        label {
            color: #fff;
            font-size: 14px;
            margin-bottom: 4px;
            display: block;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 85%;
            padding: 10px 36px 10px 12px;
            background: #181818;
            border: 2px solid #6c2eb7;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus {
            border: 2px solid #a259ff;
        }
        .password-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #a259ff;
            font-size: 16px;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a259ff;
            font-size: 16px;
        }
        .forgot-link {
            color: #a259ff;
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 10px;
            display: inline-block;
            transition: color 0.2s;
        }
        .forgot-link:hover {
            color: #fff;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }
        .checkbox-group input[type="checkbox"] {
            accent-color: #a259ff;
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }
        .checkbox-group label {
            color: #fff;
            font-size: 14px;
            margin: 0;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #6c2eb7;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        button:hover {
            background: #a259ff;
        }
        .switch-form {
            text-align: center;
            margin-top: 18px;
        }
        .switch-form a {
            color: #a259ff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .switch-form a:hover {
            color: #fff;
        }
        .error {
            color: #ff4d4d;
            margin-top: 8px;
            font-size: 13px;
            min-height: 18px;
        }
        .user-agreement {
            color: #bdbdbd;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .user-agreement a {
            color: #a259ff;
            text-decoration: underline;
        }
        .user-agreement a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <form id="loginForm" class="auth-form active">
            <div class="form-header">
                <span style="font-size:18px;color:#fff;">Вход</span>
                <a href="#" class="close-btn" onclick="window.location.href='../'">×</a>
            </div>
            <div class="form-group">
                <label for="loginEmail">Эл. почта или телефон</label>
                <input type="text" name="email" id="loginEmail" placeholder="Введите email или телефон" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Пароль</label>
                <input type="password" name="password" id="loginPassword" placeholder="Введите пароль" required>
                <span class="toggle-password" id="toggleLoginPassword">👁</span>
            </div>
            <a href="#" class="forgot-link">Забыли пароль?</a>
            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe" name="remember_me">
                <label for="rememberMe">Запомнить меня</label>
            </div>
            <div class="g-recaptcha" data-sitekey="6LdTfkIrAAAAAG83DcwWCkUa21zCBBu8Icb1Hq-4"></div>
            <input type="hidden" name="csrf_token" id="csrf_token">
            <button type="submit">Войти</button>
            <div class="error" id="errorMessage"></div>
            <div class="switch-form">
                <a href="#" id="switchToRegister">Зарегистрироваться</a>
            </div>
        </form>

        <form id="registerForm" class="auth-form">
            <div class="form-header">
                <span style="font-size:18px;color:#fff;">Регистрация</span>
                <a href="#" class="close-btn" onclick="window.location.href='../'">×</a>
            </div>
            <div class="form-group">
                <label for="registerName">Имя</label>
                <input type="text" name="name" id="registerName" placeholder="Введите имя" required>
            </div>
            <div class="form-group">
                <label for="registerEmail">Эл. почта</label>
                <input type="email" name="email" id="registerEmail" placeholder="Введите email" required>
            </div>
            <div class="form-group">
                <label for="phone">Номер телефона</label>
                <input type="tel" name="phone" id="phone" placeholder="+7 (___) ___-__-__">
            </div>
            <div class="form-group">
                <label for="registerPassword">Придумайте пароль</label>
                <input type="password" name="password" id="registerPassword" placeholder="Введите пароль" required>
                <span class="toggle-password" id="toggleRegisterPassword">👁</span>
                <div class="error" id="passwordHint"></div>
            </div>
            <div class="user-agreement">
                Регистрируясь, вы соглашаетесь с <a href="#" target="_blank">пользовательским соглашением</a>.
            </div>
            <input type="hidden" name="csrf_token" id="register_csrf_token">
            <button type="submit">Зарегистрироваться</button>
            <div class="error" id="registerErrorMessage"></div>
            <div class="switch-form">
                <a href="#" id="switchToLogin">Я уже зарегистрирован</a>
            </div>
        </form>
    </div>

    <script>
        // Получение CSRF-токена с сервера
        async function fetchCsrfToken() {
            try {
                const response = await fetch('../api/auth.php?action=check', {
                    method: 'GET',
                    credentials: 'include'
                });
                const text = await response.text();
                const result = JSON.parse(text);
                if (result.status === 'success') {
                    return result.csrf_token || null;
                }
                return null;
            } catch (error) {
                return null;
            }
        }

        // Установка CSRF-токена
        (async () => {
            const csrfToken = await fetchCsrfToken();
            if (csrfToken) {
                document.getElementById('csrf_token').value = csrfToken;
                document.getElementById('register_csrf_token').value = csrfToken;
            } else {
                const localToken = btoa(Math.random().toString(36).substring(2, 15) + Date.now());
                document.getElementById('csrf_token').value = localToken;
                document.getElementById('register_csrf_token').value = localToken;
            }
        })();

        // Переключение форм
        document.getElementById('switchToRegister').addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelectorAll('.auth-form').forEach(el => el.classList.remove('active'));
            document.getElementById('registerForm').classList.add('active');
        });
        document.getElementById('switchToLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelectorAll('.auth-form').forEach(el => el.classList.remove('active'));
            document.getElementById('loginForm').classList.add('active');
        });

        // Переключение видимости пароля
        document.getElementById('toggleLoginPassword').addEventListener('click', () => {
            const password = document.getElementById('loginPassword');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            document.getElementById('toggleLoginPassword').textContent = type === 'password' ? '👁' : '👁️‍🗨️';
        });
        document.getElementById('toggleRegisterPassword').addEventListener('click', () => {
            const password = document.getElementById('registerPassword');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            document.getElementById('toggleRegisterPassword').textContent = type === 'password' ? '👁' : '👁️‍🗨️';
        });

        // Маска для номера телефона
        const phoneInput = document.getElementById('phone');
        phoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 1) {
                value = value.substring(1);
            }
            if (value.length > 0) {
                let formatted = '+7';
                if (value.length > 0) formatted += ' (' + value.substring(0, 3);
                if (value.length >= 3) formatted += ') ' + value.substring(3, 6);
                if (value.length >= 6) formatted += '-' + value.substring(6, 8);
                if (value.length >= 8) formatted += '-' + value.substring(8, 10);
                e.target.value = formatted;
            } else {
                e.target.value = '';
            }
        });

        let loginAttempts = 0;

        // Обработка форм
        async function handleFormSubmit(form, action) {
            const formData = new FormData(form);
            const data = {};
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }

            if (form.id === 'loginForm') {
                const recaptchaResponse = grecaptcha.getResponse();
                if (!recaptchaResponse) {
                    document.getElementById('errorMessage').textContent = 'Пожалуйста, подтвердите, что вы не робот';
                    return;
                }
                data['g-recaptcha-response'] = recaptchaResponse;
            } else {
                // Для регистрации очищаем ошибку капчи, если вдруг осталась
                document.getElementById('registerErrorMessage').textContent = '';
            }

            // Для чекбокса remember_me
            if (form.id === 'loginForm') {
                data['remember_me'] = document.getElementById('rememberMe').checked ? 1 : 0;
            }
            // Преобразование номера телефона в формат +7XXXXXXXXXX
            if (data.phone) {
                data.phone = '+7' + data.phone.replace(/\D/g, '').substring(1);
            }
            const errorElement = form.id === 'loginForm' ? document.getElementById('errorMessage') : document.getElementById('registerErrorMessage');
            const passwordHint = document.getElementById('passwordHint');

            if (action === 'register') {
                const password = data.password;
                const passwordRegex = /^(?=.*[A-Z])(?=.*[!@#$%^&*])(?=.{6,})/;
                if (!passwordRegex.test(password)) {
                    passwordHint.textContent = 'Пароль должен содержать минимум 6 символов, 1 заглавную букву и 1 спецсимвол (!@#$%^&*)';
                    return;
                }
                passwordHint.textContent = '';
            }

            if (action === 'login') {
                loginAttempts++;
                if (loginAttempts === 2) {
                    errorElement.textContent = 'Следующая попытка приведет к блокировке аккаунта';
                }
            }

            try {
                const response = await fetch('../api/auth.php?action=' + action, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                const text = await response.text();
                const result = JSON.parse(text);
                if (result.status === 'success') {
                    loginAttempts = 0;
                    errorElement.textContent = '';
                    const roleId = String(result.user ? result.user.role : '2');
                    if (action === 'register') {
                        window.location.href = 'auth.html';
                    } else if (roleId === '1') {
                        window.location.href = '../../admin/admin.php';
                    } else if (roleId === '2') {
                        window.location.href = '../../cab';
                    } else {
                        window.location.href = 'catalog copy.php';
                    }
                } else {
                    errorElement.textContent = result.message;
                }
            } catch (error) {
                errorElement.textContent = 'Ошибка соединения: ' + error.message;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            if (typeof grecaptcha === 'undefined') {
                document.getElementById('errorMessage').textContent = 'Ошибка загрузки reCAPTCHA. Пожалуйста, обновите страницу.';
                return;
            }
            handleFormSubmit(e.target, 'login');
        });
        document.getElementById('registerForm').addEventListener('submit', e => {
            e.preventDefault();
            if (typeof grecaptcha === 'undefined') {
                document.getElementById('registerErrorMessage').textContent = 'Ошибка загрузки reCAPTCHA. Пожалуйста, обновите страницу.';
                return;
            }
            handleFormSubmit(e.target, 'register');
        });
    </script>
</body>
</html>

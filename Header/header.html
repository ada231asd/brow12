<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DimTech</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .comparison-link, .cart-icon {
            position: relative;
        }

        .comparison-link img, .cart-icon img {
            width: 24px;
            height: 24px;
        }

        #comparison-counter, #cart-counter {
            background-color: #ff4444;
            color: #fff;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 12px;
            position: absolute;
            top: -10px;
            right: -10px;
        }

        .prof {
            position: relative;
        }

        .profile-link {
            display: flex;
            align-items: center;
        }

        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .auth-indicator {
            position: absolute;
            top: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>
    <header>
        <div class="hed_top" >
                <div class="logo" onclick="redirectToHome()">
                <p>DIM</p>
                <p id="TECH">TECH</p>
            </div>
            
            <div class="con">
                <p>+7 (812) 660-50-54</p>
                <p>+7 (958) 111-95-03</p>
                <p id="ras">Пн-вс: с 10:00 до 21:00</p>
            </div>
            <div class="icon_top">
                <div class="comparison-link">
                    <a href="/../brow12/front/comparison.php"><img src="/../brow12/img/compair.svg" alt="Сравнение"></a>
                    <span id="comparison-counter" style="display: none;">0</span>
                </div>
                <div class="cart-icon">
                    <a href="/../brow12/front/cart.php"><img src="/../brow12/img/corz.svg" alt="Корзина"></a>
                    <span id="cart-counter" style="display: none;">0</span>
                </div>
            </div>
            <div class="prof">
                <a href="/../brow12/cab/polzovatel/polzovatel.php" class="profile-link">
                    <img id="profile-icon" src="/../brow12/img/profil.svg" alt="Профиль" class="profile-img">
                    <span id="auth-indicator" class="auth-indicator" style="display: none;"></span>
                </a>
            </div>
        </div>
        <div class="hed_down">
            <div class="cat">
                <img src="/../brow12/img/cat.svg" alt="">
                <p><a href="/../brow12/front/catalog copy.php">Каталог товаров</a></p>
            </div>
            <div class="nav">
                <ul>
                    <li><a href="">О компании</a></li>
                    <li><a href="/../brow12/front/actions.php">Акции</a></li>
                    <li><a href="">Рассрочка 0|0|18</a></li>
                    <li><a href="">Наши услуги</a></li>
                    <li><a href="">Контакты</a></li>
                </ul>
            </div>
        </div>
    </header>
    <script>
        function redirectToHome() {
            window.location.href = '/brow12/index.php';
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            async function fetchUserData() {
                try {
                    const response = await fetch('/../brow12/api/get_full_user.php', {
                        method: 'GET',
                        credentials: 'include'
                    });
        
                    const data = await response.json();
        
                    if (data.status === 'success') {
                        updateHeader(data.data);
                    } else {
                        resetHeader();
                    }
                } catch (error) {
                    console.error('Ошибка при получении данных пользователя:', error);
                    resetHeader();
                }
            }
        
            function updateHeader(userData) {
                // Счетчик корзины (сумма quantity)
                const cartCounter = document.getElementById('cart-counter');
                const cartTotalQuantity = userData.cart.reduce((sum, item) => sum + item.quantity, 0);
                cartCounter.textContent = cartTotalQuantity;
                cartCounter.style.display = cartTotalQuantity > 0 ? 'inline-block' : 'none';
        
                // Счетчик сравнения (количество записей)
                const comparisonCounter = document.getElementById('comparison-counter');
                const comparisonItems = userData.comparisons.length;
                comparisonCounter.textContent = comparisonItems;
                comparisonCounter.style.display = comparisonItems > 0 ? 'inline-block' : 'none';
        
                // Фото профиля
                const profileIcon = document.getElementById('profile-icon');
                if (userData.user.photo && userData.user.photo !== '') {
                    profileIcon.src = userData.user.photo;
                } else {
                    profileIcon.src = '/../brow12/img/profil.svg';
                }
        
                // Индикатор авторизации
                const authIndicator = document.getElementById('auth-indicator');
                authIndicator.style.display = 'block';
            }
        
            function resetHeader() {
                document.getElementById('cart-counter').style.display = 'none';
                document.getElementById('comparison-counter').style.display = 'none';
                document.getElementById('profile-icon').src = '/../brow12/img/profil.svg';
                document.getElementById('auth-indicator').style.display = 'none';
            }
        
            // Подписка на событие обновления счетчиков
            window.addEventListener('updateCounters', (event) => {
                const { cartCount, comparisonCount } = event.detail;
        
                const cartCounter = document.getElementById('cart-counter');
                cartCounter.textContent = cartCount;
                cartCounter.style.display = cartCount > 0 ? 'inline-block' : 'none';
        
                const comparisonCounter = document.getElementById('comparison-counter');
                comparisonCounter.textContent = comparisonCount;
                comparisonCounter.style.display = comparisonCount > 0 ? 'inline-block' : 'none';
            });
        
            fetchUserData();
        });
        </script>
</body>
</html>
